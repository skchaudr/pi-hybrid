name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: ${{ matrix.os }} / stable
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt, llvm-tools-preview

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            rust-core -> target
            ts-bridge -> target
            py-extensions -> target

      - name: Build workspace
        run: cargo build --workspace --release --verbose

      - name: Regression gates
        shell: bash
        run: |
          set -euo pipefail

          binary="target/release/rust-core"
          if [[ ! -x "$binary" ]]; then
            echo "::error::Expected release binary at $binary"
            exit 1
          fi

          if [[ "$RUNNER_OS" == "macOS" ]]; then
            binary_size=$(stat -f %z "$binary")
          else
            binary_size=$(stat -c %s "$binary")
          fi

          max_size=$((6 * 1024 * 1024))
          if (( binary_size >= max_size )); then
            echo "::error::Release binary is ${binary_size} bytes; expected < ${max_size} bytes"
            exit 1
          fi
          echo "Release binary size: ${binary_size} bytes"

          start_ms=$(python3 - <<'PY'
          import time
          print(time.perf_counter_ns() // 1_000_000)
          PY
          )
          printf '\n' | \
            PI_DEEPSEEK_API_KEY=dummy PI_GLM_API_KEY=dummy \
            "$binary" --validate-config >/tmp/rust-core-startup.txt
          end_ms=$(python3 - <<'PY'
          import time
          print(time.perf_counter_ns() // 1_000_000)
          PY
          )
          elapsed_ms=$((end_ms - start_ms))

          if (( elapsed_ms >= 500 )); then
            echo "::error::Cold startup took ${elapsed_ms}ms; expected < 500ms"
            cat /tmp/rust-core-startup.txt
            exit 1
          fi
          echo "Cold startup: ${elapsed_ms}ms"

      - name: Run tests (rust-core + ts-bridge)
        run: cargo test -p rust-core -p ts-bridge --verbose

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace -- -D warnings

      - name: Format check
        run: cargo fmt --check --all

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Security audit
        run: cargo audit

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Generate coverage
        run: |
          cargo llvm-cov --workspace \
            --exclude py-extensions \
            --summary-only
